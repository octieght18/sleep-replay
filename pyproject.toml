[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sleep-replay"
version = "0.3.0"
description = "Sleep Replay: turns a night of sleep and bedroom telemetry into a compressed audio replay."
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.5; python_version < '3.12'",
    "numpy==2.5.3; python_version >= '3.12'",
    "tzdata==2026.4",
    "PyYAML==6.0.3",
    "fastapi==0.115.12",
    "uvicorn==0.34.3",
    "python-multipart==0.0.20",
    "starlette==0.46.2", "pydantic==2.11.7", "pydantic-core==2.33.2",
    "annotated-types==0.7.0", "typing-extensions==4.14.1", "typing-inspection==0.4.1",
    "anyio==4.9.0", "idna==3.10", "sniffio==1.3.1", "click==8.2.1", "h11==0.16.0",
    "colorama==0.4.6; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "hypothesis==6.168.3",
    "httpx==0.28.1", "httpcore==1.0.9", "certifi==2025.8.3",
    "iniconfig==2.3.0", "packaging==26.3", "pluggy==1.6.0", "pygments==2.21.0", "sortedcontainers==2.4.0",
    "mini-racer==0.12.4",
]

[project.scripts]
sleep-replay = "backend.api.cli:main"
sleep-replay-app = "backend.api.run:main"

[tool.setuptools.packages.find]
include = ["backend*", "tools*"]

[tool.pytest.ini_options]
# `python -m pytest` from the repository root runs the whole suite and exits
# non-zero when any test fails.
minversion = "9.0"
testpaths = ["tests"]
# Make `backend` and `tools` importable without installing the project.
pythonpath = ["."]
# -p no:cacheprovider: the suite must not write files into the repository
# (Requirement 18.7), so pytest's .pytest_cache is disabled.
addopts = "-ra --strict-markers --strict-config -p no:cacheprovider"
xfail_strict = true
markers = ["reference_machine: timed audio generation checks; deselect with -m 'not reference_machine'", "browser: optional Chromium DOM/playback tests"]
