# All targets: pulse_rate, rhythmic_density, intensity, transient_density,
# brightness, texture_density, modulation, none. "none" disables a contribution.
# Every sensitivity: 0.0–1.0; browser controls use 0.05 steps.
heart_rate:
  target: pulse_rate  # Higher heart rate increases pulse speed.
  sensitivity: 0.5  # Larger values increase distance from neutral (0.5).
  smoothing_minutes: 5  # Integer 1–60, in night-time minutes.
  hysteresis: 1.0  # 0–10 bpm: minimum raw change before the contribution updates.
hrv:
  target: modulation  # Higher HRV increases modulation depth.
  sensitivity: 0.3
  smoothing_minutes: 15  # Integer 1–60 night-time minutes.
  hysteresis: 2.0  # 0–20 ms.
movement:
  target: transient_density  # More movement adds soft blips.
  sensitivity: 0.8  # No smoothing/hysteresis keys are accepted for movement.
temperature:
  target: brightness  # Higher temperature increases upper harmonics.
  sensitivity: 0.3
  smoothing_minutes: 15  # Integer 1–60 night-time minutes.
  hysteresis: 0.1  # 0–1 °C; display units do not change canonical thresholds.
humidity:
  target: texture_density  # Higher humidity thickens the filtered noise texture.
  sensitivity: 0.3
  smoothing_minutes: 15  # Integer 1–60 night-time minutes.
  hysteresis: 0.5  # 0–5 percentage points.
pressure:
  target: modulation  # Higher pressure increases modulation, at half excursion.
  sensitivity: 0.2
  smoothing_minutes: 15  # Integer 1–60 night-time minutes.
  hysteresis: 0.1  # 0–1 hPa.
target_duration: 180  # Seconds: 30, 120, 180, 300, 600. Default three minutes.
random_seed: 20240301  # Integer 0–4294967295; fixes all randomized musical choices.
